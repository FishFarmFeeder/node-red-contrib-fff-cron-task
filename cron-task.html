<script type="text/javascript">
    RED.nodes.registerType('fff-cron-task',{
        category: 'function',
        color: '#9FE5FF',
        defaults: {
            name: {value:""},
            persistent: {value:false}
        },
        inputs:1,
        outputs:2,
        icon: "font-awesome/fa-clock-o",
        label: function() {
            return this.name||"cron-task";
        }
    });
</script>

<script type="text/html" data-template-name="fff-cron-task">
    <div class="form-row">
        <label for="node-input-name"><i class="icon-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-persistent"><i class="fa fa-save"></i> Persistent</label>
        <input type="checkbox" id="node-input-persistent" style="display:inline-block; width:auto; vertical-align:baseline;">
        <label for="node-input-persistent" style="width:auto;">Save jobs across restarts</label>
    </div>
</script>

<script type="text/html" data-help-name="fff-cron-task">
    <p>Schedule one-shot or recurring tasks using a Date or a cron expression. Supports multiple independent jobs in one node and optional persistence across restarts.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Persistent <span class="property-type">boolean</span></dt>
        <dd>When checked, scheduled jobs are stored in the node context and restored on redeploy or restart. See the Persistence note below.</dd>
    </dl>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg.cron <span class="property-type">string</span></dt>
        <dd>Cron expression with 5 or 6 fields (e.g. <code>"*/10 * * * *"</code>). When set, the input is validated strictly as cron.</dd>

        <dt>msg.date <span class="property-type">Date | string</span></dt>
        <dd>One-shot execution time. Must be in the future. When set, the input is validated strictly as a date.</dd>

        <dt>msg.inputDate <span class="property-type">string | Date</span></dt>
        <dd>Legacy field. Accepts either a cron expression or a date and auto-detects which is which. Kept for backward compatibility — prefer <code>msg.cron</code> or <code>msg.date</code> for new flows.</dd>

        <dt class="optional">msg.job_id <span class="property-type">string</span></dt>
        <dd>Identifies the job inside this node instance. Defaults to <code>"default"</code>. Use different ids to run multiple jobs in parallel.</dd>

        <dt class="optional">msg.action <span class="property-type">string</span></dt>
        <dd>
            Control command. One of:
            <ul>
                <li><code>"cancel"</code> — stops the job referenced by <code>msg.job_id</code> (or <code>"default"</code> if omitted).</li>
                <li><code>"cancelAll"</code> — stops every active job in this node instance.</li>
                <li><code>"list"</code> — emits the current job list on output 1 (see below). Does not schedule anything.</li>
            </ul>
        </dd>
    </dl>

    <p>If more than one of <code>msg.cron</code>, <code>msg.date</code> or <code>msg.inputDate</code> is set, the priority is: <code>msg.cron</code> &gt; <code>msg.date</code> &gt; <code>msg.inputDate</code>.</p>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Triggered events and <code>list</code> responses
            <p>When a schedule fires:</p>
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Always <code>"triggered"</code>.</dd>

                <dt>original_payload <span class="property-type">string | Date</span></dt>
                <dd>The original schedule input that fired.</dd>

                <dt>job_id <span class="property-type">string</span></dt>
                <dd>The job id that fired.</dd>

                <dt>timestamp <span class="property-type">number</span></dt>
                <dd>Epoch milliseconds at fire time.</dd>

                <dt>nextInvocation <span class="property-type">string | null</span></dt>
                <dd>ISO-8601 timestamp of the next scheduled run. <code>null</code> for one-shot dates after they fire.</dd>
            </dl>
            <p>When <code>msg.action="list"</code> is received:</p>
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Always <code>"jobs"</code>.</dd>

                <dt>jobs <span class="property-type">array</span></dt>
                <dd>One entry per active job: <code>{ job_id, schedule, type, nextInvocation }</code>.</dd>
            </dl>
        </li>
        <li>Errors
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Human-readable error message.</dd>

                <dt>error <span class="property-type">object</span></dt>
                <dd>Structured error with a <code>type</code> field. Possible types: <code>MissingInput</code>, <code>InvalidCron</code>, <code>InvalidDate</code>, <code>PastDate</code>, <code>ScheduleFailed</code>, <code>ScheduleError</code>.</dd>
            </dl>
        </li>
    </ol>

    <h3>Persistence</h3>
    <p>When <b>Persistent</b> is enabled, jobs are written to the node context under the key <code>scheduled_jobs</code> and restored on restart or redeploy. <b>Important:</b> by default Node-RED stores context in memory, so jobs are lost on a real process restart. To survive restarts, configure a filesystem context store in <code>settings.js</code>:</p>
    <pre>contextStorage: {
    default: { module: "localfilesystem" }
}</pre>
</script>
